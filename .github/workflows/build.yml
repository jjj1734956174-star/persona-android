
name: Build Persona Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract and build APK
        run: |
          unzip -o PersonaAndroid_Full_MVP.zip -d project
          APP_DIR="$(dirname "$(find project -type f -name pubspec.yaml -print -quit)")"

          if [ ! -f "$APP_DIR/pubspec.yaml" ]; then
            echo "Flutter project not found"
            find project -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "Flutter project found: $APP_DIR"
          cd "$APP_DIR"

          flutter create . --platforms=android --org com.persona.app
          flutter pub get
          flutter build apk --release

          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/app-release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonaAndroid-APK
          path: app-release.apk
