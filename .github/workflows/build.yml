name: Build Persona Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o PersonaAndroid_Full_MVP.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android platform
        working-directory: project/app
        run: flutter create . --platforms=android --org com.persona.app

      - name: Build APK
        working-directory: project/app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonaAndroid-APK
          path: project/app/build/app/outputs/flutter-apk/app-release.apk
